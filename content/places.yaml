  floor: "3"
  layer: tower
  spoilerLevel: endings
  summary: The highest room in Nemeton.
  what: The climb to the bell tower and the end of the story.
  route:
    - "Climb the outer spire. On the second floor the Tree of Life attacks: use Flare and fire weapons, with Edward on the shotgun. Each tentacle has about 8,000 HP but goes down quickly. On the way you find the AGL Idol (give it to Koudelka), the INT Idol (James) and the STR Idol (Edward)."
    - A hidden save point is behind small vertical spirals. If you have the Pendant you pass; if not, a Black Cat must be fought for it. Higher up, a lotus flower is stuck to the tree.
    - "Fifth floor: the first fight with Elaine. Edward in front with the Evil Horn, Koudelka and James with Flare, and protect the party with Reflect. Sixth floor: the second fight, with Geyser and Megalith and Edward on the Lifedrinker."
    - "At the top is the sunrise, and the last fight. Cast Reflect on all three, put Edward in front with the Lifedrinker, and finish with Megalith. Date of the ending: 1 November 1898."
  items:
    - Shotgun Shells, idols (each raises one stat), a rod.
    - Keep Koudelka's Pendant. Without it the last fight cannot be survived.
  foes: Reflect and the sword that drains HP are the best tools.
  sealed: The last form is much stronger and heals itself several times. The ending depends on whether you carried the Pendant and how the last fight goes, and it has its own sealed page.
